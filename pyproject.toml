[project]
name = "primeait"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HenryHYeary", email = "henmofb@yahoo.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "community>=1.0.0b1",
    "dotenv>=0.9.9",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.2",
    "litellm>=1.100.1",
    "requests>=2.34.2",
]

[project.scripts]
primeait = "primeait:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
