[project]
name = "primeait"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HenryHYeary", email = "henmofb@yahoo.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "python-dotenv>=1.0.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "litellm>=1.100.1",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "unstructured[md]>=0.27.6",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

[project.scripts]
primeait = "primeait:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
